<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#07110e">
  <title>掌控</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main id="gate">
    <header class="brand">
      <div class="mark" aria-hidden="true">掌</div>
      <div>
        <p class="eyebrow">同一台路由 · Windows 远程桌面</p>
        <h1>掌控</h1>
        <p class="lead">平板打开这个网页，操作电脑上的 Windows。画面由系统远程桌面直接编码。</p>
      </div>
    </header>

    <section id="host" class="card host" hidden>
      <div class="host-copy">
        <h2>用平板打开</h2>
        <p>电脑插网线、平板连这台路由的 Wi-Fi 即可。扫下面的码，或在平板浏览器输入地址。</p>
        <p id="rdpState" class="state"></p>
        <p class="secret-label">访问密码</p>
        <p id="accessPassword" class="secret"></p>
        <p id="lanUrl" class="url"></p>
        <p class="hint">优先用第一行地址。打不开再试下面几行，那些多半是虚拟网卡。</p>
        <p class="hint">平板上还要填写这台电脑的 Windows 用户名和密码。用户名是 <strong id="winUser"></strong>。连接后，电脑前的屏幕会锁定。</p>
        <div class="row">
          <button type="button" id="copyUrl" class="ghost">复制地址</button>
          <button type="button" id="allowPort" class="ghost">放行平板访问</button>
        </div>
      </div>
      <img id="qr" alt="平板扫码打开" width="220" height="220">
    </section>

    <form id="login" class="card">
      <h2>连接到这台电脑</h2>
      <label>访问密码<input id="gatePassword" autocomplete="off" inputmode="numeric" required></label>
      <label>Windows 用户名<input id="user" autocomplete="username" required></label>
      <label>Windows 密码<input id="winPassword" type="password" autocomplete="current-password" required></label>
      <label>远程桌面分辨率
        <select id="resolution"></select>
      </label>
      <p id="sizeHint" class="hint"></p>
      <button type="submit" id="connect">连接</button>
      <p id="loginError" class="error" role="alert"></p>
      <p class="hint">请在平板上连接。在电脑自己的浏览器里连接，会锁住你正在看的这块屏幕。</p>
    </form>
  </main>

  <section id="desk" hidden>
    <header class="top">
      <span id="deskTitle">远程桌面</span>
      <select id="deskResolution" aria-label="远程桌面分辨率"></select>
      <span id="deskSize"></span>
      <button type="button" id="hangup">断开</button>
    </header>
    <div id="stage">
      <canvas id="screen" tabindex="0" aria-label="远程桌面"></canvas>
    </div>
    <footer class="dock">
      <button type="button" id="keyToggle">键盘</button>
      <button type="button" id="rightArm">右键</button>
      <button type="button" id="fitView">适应</button>
      <button type="button" id="hangup2">断开</button>
    </footer>
    <section id="keys" hidden>
      <div class="key-grid" id="keyGrid"></div>
      <label class="type-row">在这里打字，选完词会发到电脑。Ctrl、Alt、Shift、Win 点一下会按住，断开时会全部松开。
        <span>
          <textarea id="typeBox" rows="2" placeholder="中文在这里输入"></textarea>
          <button type="button" id="typeSend">发送</button>
        </span>
      </label>
    </section>
    <p id="deskError" class="toast" hidden></p>
  </section>
  <script type="module" src="/app.js"></script>
</body>
</html>
